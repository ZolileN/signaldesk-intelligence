## ──────────────────────────────────────────────────────────────────────────────
## SignalDesk Africa — Render Infrastructure-as-Code (render.yaml)
## Deploy: Connect this repo on Render → it auto-discovers this file.
## ──────────────────────────────────────────────────────────────────────────────

databases:
  - name: signaldesk-db
    plan: free
    databaseName: signaldesk_db
    user: signaldesk
    postgresMajorVersion: "16"
    ipAllowList: []  # Allow all connections

services:
  - type: web
    name: signaldesk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: signaldesk-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true
